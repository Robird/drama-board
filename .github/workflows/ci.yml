name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned storage source
        uses: actions/checkout@v4
        with:
          repository: Atelia-org/atelia-storage
          ref: 70b406cd8d1117733eee81a33e7f978399aa98b2
          path: external/atelia-storage
      - name: Check out pinned DurableGraph source
        uses: actions/checkout@v4
        with:
          repository: Atelia-org/durable-graph
          ref: c549124f1db53fe028f4640ddcafd8f338bb076b
          path: external/durable-graph
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Prepare pinned DurableGraph packages
        shell: pwsh
        run: ./scripts/Prepare-DurableGraph.ps1 -DurableGraphSource ./external/durable-graph -StorageSource ./external/atelia-storage
      - name: Build solution
        run: dotnet build DramaBoard.Local.slnx -m:1 -warnaserror -p:DurableGraphSchemaHistoryMode=Verify
      - name: Test
        run: dotnet test DramaBoard.Local.slnx --no-build --no-restore -m:1
