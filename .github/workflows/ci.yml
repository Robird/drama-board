name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: drama-board
    steps:
      - uses: actions/checkout@v4
        with:
          path: drama-board
      - name: Check out storage source
        uses: actions/checkout@v4
        with:
          repository: Atelia-org/atelia-storage
          ref: 9ad39fc51a420e8302468533b82d8bc3a91a403e
          path: atelia-storage
      - name: Check out current DurableGraph source
        uses: actions/checkout@v4
        with:
          repository: Atelia-org/durable-graph
          ref: master
          path: durable-graph
      - name: Check out current Completion source
        uses: actions/checkout@v4
        with:
          repository: Atelia-org/atelia-completion
          ref: main
          path: atelia-completion
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: drama-board/global.json
      - name: Build solution
        run: dotnet build DramaBoard.slnx -c Release -m:1 -warnaserror -p:DurableGraphSchemaHistoryMode=Verify
      - name: Test
        run: dotnet test DramaBoard.slnx -c Release --no-build --no-restore -m:1
