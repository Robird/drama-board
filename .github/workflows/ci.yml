name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned Atelia dependency
        uses: actions/checkout@v4
        with:
          repository: Atelia-org/atelia
          ref: 742fcd62e691b6b6acca4113a3ac3638bc7275ba
          path: external/atelia
      - name: Check out pinned DurableGraph source
        uses: actions/checkout@v4
        with:
          repository: Robird/durable-graph
          ref: 4cea773e3eac7a2df2d57e518f45e90459d53cf3
          path: external/durable-graph
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Prepare pinned DurableGraph packages
        shell: pwsh
        run: ./scripts/Prepare-DurableGraph.ps1 -DurableGraphSource ./external/durable-graph -AteliaSource ./external/atelia
      - name: Build
        run: dotnet build DramaBoard.Local.slnx -warnaserror -p:DurableGraphSchemaHistoryMode=Verify
      - name: Test
        run: dotnet test DramaBoard.Local.slnx --no-build --no-restore
