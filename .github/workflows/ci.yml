name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned Atelia dependency
        uses: actions/checkout@v4
        with:
          repository: Atelia-org/atelia
          ref: 742fcd62e691b6b6acca4113a3ac3638bc7275ba
          path: external/atelia
      - name: Check out pinned DurableGraph source
        uses: actions/checkout@v4
        with:
          repository: Robird/durable-graph
          ref: 4cea773e3eac7a2df2d57e518f45e90459d53cf3
          path: external/durable-graph
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Prepare pinned DurableGraph packages
        shell: pwsh
        run: ./scripts/Prepare-DurableGraph.ps1 -DurableGraphSource ./external/durable-graph -AteliaSource ./external/atelia
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: src/WebUI/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix src/WebUI ci
      - name: Build frontend
        run: npm --prefix src/WebUI run build
      - name: Build solution
        run: dotnet build DramaBoard.Local.slnx -m:1 -warnaserror -p:DurableGraphSchemaHistoryMode=Verify
      - name: Test
        run: dotnet test DramaBoard.Local.slnx --no-build --no-restore -m:1
      - name: Publish local server
        shell: pwsh
        run: ./scripts/Publish-Server.ps1
      - name: Install Chromium
        working-directory: src/WebUI
        run: npx playwright install --with-deps chromium
      - name: Verify published server in Chromium
        run: npm --prefix src/WebUI run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-evidence-${{ matrix.os }}
          path: artifacts/0025/
